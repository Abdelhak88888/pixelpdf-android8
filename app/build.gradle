plugins {
    id 'com.android.application'
}

// Huawei AGC plugin — only apply when a real agconnect-services.json is present.
// (The placeholder file has YOUR_* values, so we skip it to avoid build failure.)
def hasRealAgconnect = new File("${projectDir}/agconnect-services.json").exists() &&
        !file("${projectDir}/agconnect-services.json").getText().contains("YOUR_")
if (hasRealAgconnect) {
    apply plugin: 'com.huawei.agconnect'
}

android {
    namespace 'com.pixelpdf.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.pixelpdf.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Only define the release signing config when a keystore is provided
    // (via GitHub secrets). Otherwise Gradle must NOT see it so builds don't fail.
    def signingEnabled = System.getenv("KEYSTORE_PRESENT") == "true"
    if (signingEnabled) {
        signingConfigs {
            release {
                storeFile file(rootProject.file("keystore.jks"))
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("KEYSTORE_ALIAS") ?: ""
                keyPassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        debug {
            // default debug signing (auto-generated by AGP)
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingEnabled) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        // Resolve duplicate Kotlin stdlib classes between different HMS modules
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

configurations.all {
    // Force a single Kotlin stdlib version to avoid duplicate-class build failures.
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    }
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'

    // Huawei HMS Core
    implementation 'com.huawei.hms:ads-lite:13.4.55.300'   // Huawei Ads Kit (rewarded, banner, interstitial)
    implementation 'com.huawei.hms:iap:6.16.6.305'         // Huawei In-App Purchases
    implementation 'com.huawei.hms:hianalytics:6.12.0.301' // Huawei Analytics (required by ads-lite)
    implementation 'com.huawei.agconnect:agconnect-core:1.9.3.301'
}
